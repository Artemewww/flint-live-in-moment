<!doctype html>
<html lang="ru">
  <head>
    <script>
      (function() {
        try {
          var realFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return realFetch;
            },
            set: function(val) {
              realFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Unable to make window.fetch configurable:', e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="description" content="Живи в моменте — афиша и календарь событий трезвого сообщества осознанного общения. Минск, Беларусь." />
    <title>Живи в моменте • Афиша событий</title>
    <!-- Telegram Mini App SDK: даёт личность пользователя и тему при запуске из бота -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
