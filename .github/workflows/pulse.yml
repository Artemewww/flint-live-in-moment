name: Пульс клуба

# Раз в час, scripts/pulse.mts:
#   • «состоится при N» (баня от 10 человек) — api/_lib/quorum.ts;
#   • дни рождения: 10:00 именной баннер, 20:00 «открытка от клуба» — api/_lib/birthday.ts.
# Суточный крон Vercel не поймает ни дедлайн «за 4 часа», ни 10:00/20:00.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      event_id:
        description: 'ID события (пусто — все ближайшие)'
        required: false
        default: ''

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Пульс
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "нет секретов — пропускаю"; exit 0; fi
          if [ -n "${{ inputs.event_id }}" ]; then npx -y tsx scripts/pulse.mts --event "${{ inputs.event_id }}"; else npx -y tsx scripts/pulse.mts; fi
